name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.12.0'
        cache: 'npm'

    - name: Verify Node.js version
      run: |
        node -v
        npm -v

    - name: Install dependencies
      run: npm ci

    - name: Run Linting (Astro Check)
      run: npm run check

    - name: Run Tests
      run: npm test

    - name: Test Build
      run: npm run build